name: Update README cards

on:
  schedule:
    - cron: "0 4 * * *"      # every day at 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # lets the workflow commit the SVG files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build SVG cards
        env:
          # ACCESS_TOKEN secret if it exists (adds private commits), else the built-in token
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python today.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md photo_cropped.png
          git diff --staged --quiet || git commit -m "Update profile card"
          git push

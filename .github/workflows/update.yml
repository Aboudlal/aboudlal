name: Update README cards

on:
  schedule:
    - cron: "0 4 * * *"      # tous les jours à 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:          # bouton "Run workflow" manuel

permissions:
  contents: write             # autorise le workflow à commiter les SVG

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Mettre à jour les SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python today.py

      - name: Commiter les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Mise à jour automatique des stats"
          git push
